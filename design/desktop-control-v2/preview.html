<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支点课堂控制窗口 · 设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#dae2ec;color:#263345;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7298c6;outline-offset:3px}.sheet{max-width:1184px;margin:auto;padding:28px 32px 32px}.sheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}.sheet-head h1{font-size:22px;margin:0}.sheet-head span{font-size:13px;color:#52667d}.screens{display:grid;grid-template-columns:1fr 1fr;gap:28px}.caption{font-size:13px;font-weight:600;color:#52667d;margin-bottom:10px}.window{position:relative;height:840px;border:1px solid #bcc9da;border-radius:18px;overflow:hidden;background:#e8edf4;box-shadow:0 14px 35px #293e5520}.titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #d4dce7;background:#f9fbfd;font-size:12px;color:#536173}.traffic{width:11px;height:11px;border-radius:50%;background:#fa675f}.traffic:nth-child(2){background:#f7bf44}.traffic:nth-child(3){background:#65c64e}.titlebar b{margin-left:16px;font-weight:500}.content{padding:22px 24px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:52px;height:52px;border-radius:12px}.brand h2{font-size:23px;margin:0 0 5px;font-weight:750;letter-spacing:-.5px}.version{font-size:12px;background:#dce6f3;color:#365f91;border-radius:5px;padding:3px 7px;margin-left:8px;vertical-align:middle;letter-spacing:0}.brand p{font-size:13px;color:#65758a;margin:0}.status{display:flex;align-items:center;justify-content:space-between;background:#f7f9fc;border:1px solid #d1dce8;border-radius:10px;padding:12px 14px;margin-bottom:22px;font-size:12px}.status-main{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#317653}.status strong{font-size:13px;color:#317653}.status span.port{color:#718096;margin-left:5px}.status button{background:none;border:0;color:#66778d;padding:0;font-size:12px}.heading{font-size:16px;margin:0 0 7px}.intro{font-size:12px;line-height:1.65;margin:0 0 14px;color:#64758b}.address-card{padding:18px;background:white;border:1px solid #cdd5e0;border-radius:12px;box-shadow:0 3px 9px #3552740b;margin-bottom:14px}.role-line{display:flex;align-items:center;gap:10px}.role-icon{width:34px;height:34px;border-radius:8px;background:#eaf0f7;color:#365f91;display:grid;place-items:center}.role-icon svg,.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.role-line h3{font-size:16px;margin:0 0 3px}.role-line p{font-size:11px;color:#697c92;margin:0}.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#50647d;word-break:break-all;background:#f2f5f9;border:1px solid #e4eaf2;padding:10px 11px;border-radius:7px;margin:14px 0 12px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 112px;gap:10px}.btn{border:1px solid #b6c7dc;border-radius:8px;background:white;color:#35597f;min-height:42px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:650;white-space:nowrap}.primary{background:#365f91;border-color:#365f91;color:white;box-shadow:0 2px 5px #365f911a}.primary:hover{background:#2e527f}.note{margin:11px 0 0;font-size:11px;line-height:1.6;color:#6b7e93}.maintenance{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;margin-top:6px;border-top:1px solid #ced8e4;gap:12px}.maintenance h3{font-size:13px;margin:0 0 5px}.maintenance p{font-size:11px;color:#6a7d91;margin:0}.maintenance .btn{min-height:34px;font-size:12px;padding:7px 10px;font-weight:500}.footer{position:absolute;left:24px;right:24px;bottom:18px;border-top:1px solid #d5deea;padding-top:13px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#718198}.footer span:last-child{color:#52677f}.shade{position:absolute;inset:40px 0 0;background:#24374b50;display:grid;place-items:center;padding:28px}.dialog{width:100%;border:1px solid #c3cfde;border-radius:14px;background:#fff;box-shadow:0 16px 50px #14283830;padding:28px;position:relative}.close{position:absolute;right:16px;top:14px;border:0;background:none;color:#66788d;font-size:22px;padding:0 4px}.success{display:inline-flex;align-items:center;gap:6px;border-radius:5px;background:#eef7f1;color:#326b50;padding:5px 8px;font-size:11px;margin-bottom:14px}.dialog h3{font-size:21px;margin:0 0 12px}.dialog p{font-size:13px;line-height:1.8;color:#64778f;margin:0}.password-box{border:1px solid #ccd8e8;border-radius:10px;background:#f3f6fa;padding:18px;margin:22px 0 16px;text-align:center}.password-box label{font-size:12px;color:#657a93}.password{font-size:38px;line-height:1.35;color:#2d507b;letter-spacing:8px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:10px;padding-left:8px}.dialog .btn{width:100%;margin-top:10px;min-height:44px}.dialog .tip{font-size:11px;color:#75869a;text-align:center;margin-top:16px}.demo{font-size:11px;color:#52667d;text-align:center;margin:18px 0 0}@media(max-width:850px){.screens{grid-template-columns:1fr}.sheet-head{display:block}.sheet-head span{display:block;margin-top:8px}.sheet{padding:20px}.window{max-width:540px;margin:auto}}@media(max-width:430px){.content{padding:18px 16px}.actions{grid-template-columns:1fr 95px}.dialog{padding:24px 20px}.shade{padding:20px}.status span.port{display:none}.url{font-size:10px}}
</style><div class="sheet"><header class="sheet-head"><h1>支点课堂 · 控制窗口</h1><span>设计预览 / 2.0.1 / 网址操作优先</span></header><div class="screens"><section><div class="caption">01　主窗口 · 服务运行中</div><div class="window" id="main"></div></section><section><div class="caption">02　重置密码成功 · 一键复制</div><div class="window" id="reset"></div></section></div><p class="demo">网址及密码均为演示内容。此预览不会启动、停止服务或重置真实密码。</p></div><script>
const icons={open:'<path d="M14 3h7v7M21 3l-9 9"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',teacher:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',student:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>'};const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
function card(role,desc,url,name,note){return `<article class="address-card"><div class="role-line"><span class="role-icon">${icon(name)}</span><div><h3>${role}</h3><p>${desc}</p></div></div><div class="url">${url}</div><div class="actions"><button class="btn primary" type="button">${icon('open')}打开${role}</button><button class="btn" type="button" data-copy="${url}">${icon('copy')}复制网址</button></div><p class="note">${note}</p></article>`}
function main(){return `<div class="titlebar"><i class="traffic"></i><i class="traffic"></i><i class="traffic"></i><b>支点课堂</b></div><div class="content"><div class="brand"><img src="app-icon.png" alt="支点课堂图标"><div><h2>支点课堂<span class="version">2.0.1</span></h2><p>ClassNode · 桌面控制面板</p></div></div><div class="status"><div class="status-main"><i class="dot"></i><strong>服务运行中</strong><span class="port">端口 3001</span></div><button type="button">停止服务</button></div><h2 class="heading">打开课堂</h2><p class="intro">教师在这台电脑上管理课堂，学生通过局域网加入。</p>${card('教师端','备课、开课与课堂管理','http://localhost:3001/teacher/','teacher','在当前电脑打开，使用管理员密码登录。')}${card('学生端','加入课堂与完成学习任务','http://192.168.1.12:3001/classroom/','student','将网址发给学生；学生设备需连接同一局域网。')}<div class="maintenance"><div><h3>管理员密码</h3><p>忘记登录密码时，可在本机重新设置。</p></div><button class="btn reset-trigger" type="button">重置密码</button></div></div><footer class="footer"><span>教学互促 · 源码共研</span><span>GitCode　 ·　GitHub</span></footer>`}
const modal=`<div class="shade"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title"><button class="close" aria-label="关闭" type="button">×</button><span class="success">✓　重置完成</span><h3 id="reset-title">新的管理员密码已生成</h3><p>请使用下方密码登录教师端。<br>这次生成的是 6 位数字，方便输入。</p><div class="password-box"><label>新管理员密码</label><div class="password">482731</div></div><button class="btn primary" type="button" data-copy="482731">${icon('copy')}复制密码</button><button class="btn" type="button">${icon('open')}打开教师端登录</button><p class="tip">登录后，可在设置中改成自己的密码。</p></div></div>`;
document.querySelector('#main').innerHTML=main();document.querySelector('#reset').innerHTML=main()+modal;
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);const label=copy.innerHTML;copy.textContent='已复制';setTimeout(()=>copy.innerHTML=label,1600)}catch{copy.textContent='请手动复制'}}if(e.target.closest('.reset-trigger')){document.querySelector('#reset').innerHTML=main()+modal;document.querySelector('#reset').scrollIntoView({behavior:'smooth',block:'center'})}if(e.target.closest('.close'))e.target.closest('.shade').remove()});
</script></html>
