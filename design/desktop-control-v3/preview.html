<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支点课堂控制窗口 · 设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#dae2ec;color:#263345;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7298c6;outline-offset:3px}.sheet{max-width:1184px;margin:auto;padding:28px 32px 32px}.sheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}.sheet-head h1{font-size:22px;margin:0}.sheet-head span{font-size:13px;color:#52667d}.screens{display:grid;grid-template-columns:1fr 1fr;gap:28px}.caption{font-size:13px;font-weight:600;color:#52667d;margin-bottom:10px}.window{position:relative;height:940px;border:1px solid #bcc9da;border-radius:18px;overflow:hidden;background:#e8edf4;box-shadow:0 14px 35px #293e5520}.titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #d4dce7;background:#f9fbfd;font-size:12px;color:#536173}.traffic{width:11px;height:11px;border-radius:50%;background:#fa675f}.traffic:nth-child(2){background:#f7bf44}.traffic:nth-child(3){background:#65c64e}.titlebar b{margin-left:16px;font-weight:500}.content{padding:20px 24px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:52px;height:52px;border-radius:12px}.brand h2{font-size:23px;margin:0 0 5px;font-weight:750;letter-spacing:-.5px}.version{font-size:12px;background:#dce6f3;color:#365f91;border-radius:5px;padding:3px 7px;margin-left:8px;vertical-align:middle;letter-spacing:0}.brand p{font-size:13px;color:#65758a;margin:0}.status{display:flex;align-items:center;justify-content:space-between;background:#f7f9fc;border:1px solid #d1dce8;border-radius:10px;padding:12px 14px;margin-bottom:22px;font-size:12px}.status-main{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#317653}.status strong{font-size:13px;color:#317653}.status span.port{color:#718096;margin-left:5px}.status button{background:none;border:0;color:#66778d;padding:0;font-size:12px}.heading{font-size:16px;margin:0 0 7px}.intro{font-size:12px;line-height:1.65;margin:0 0 14px;color:#64758b}.address-card{padding:16px;background:white;border:1px solid #cdd5e0;border-radius:12px;box-shadow:0 3px 9px #3552740b;margin-bottom:14px}.role-line{display:flex;align-items:center;gap:10px}.role-icon{width:34px;height:34px;border-radius:8px;background:#eaf0f7;color:#365f91;display:grid;place-items:center}.role-icon svg,.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.role-line h3{font-size:16px;margin:0 0 3px}.role-line p{font-size:11px;color:#697c92;margin:0}.url{user-select:all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#50647d;word-break:break-all;background:#f2f5f9;border:1px solid #e4eaf2;padding:10px 11px;border-radius:7px;margin:14px 0 12px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 112px;gap:10px}.btn{border:1px solid #b6c7dc;border-radius:8px;background:white;color:#35597f;min-height:42px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:650;white-space:nowrap}.primary{background:#365f91;border-color:#365f91;color:white;box-shadow:0 2px 5px #365f911a}.primary:hover{background:#2e527f}.note{margin:11px 0 0;font-size:11px;line-height:1.6;color:#6b7e93}.maintenance{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;margin-top:6px;border-top:1px solid #ced8e4;gap:12px}.maintenance h3{font-size:13px;margin:0 0 5px}.maintenance p{font-size:11px;color:#6a7d91;margin:0}.maintenance .btn{min-height:34px;font-size:12px;padding:7px 10px;font-weight:500}.footer{position:absolute;left:24px;right:24px;bottom:18px;border-top:1px solid #d5deea;padding-top:13px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#718198}.footer span:last-child{color:#52677f}.shade{position:absolute;inset:40px 0 0;background:#24374b50;display:grid;place-items:center;padding:28px}.dialog{width:100%;border:1px solid #c3cfde;border-radius:14px;background:#fff;box-shadow:0 16px 50px #14283830;padding:28px;position:relative}.close{position:absolute;right:16px;top:14px;border:0;background:none;color:#66788d;font-size:22px;padding:0 4px}.success{display:inline-flex;align-items:center;gap:6px;border-radius:5px;background:#eef7f1;color:#326b50;padding:5px 8px;font-size:11px;margin-bottom:14px}.dialog h3{font-size:21px;margin:0 0 12px}.dialog p{font-size:13px;line-height:1.8;color:#64778f;margin:0}.password-box{border:1px solid #ccd8e8;border-radius:10px;background:#f3f6fa;padding:18px;margin:22px 0 16px;text-align:center}.password-box label{font-size:12px;color:#657a93}.password{font-size:38px;line-height:1.35;color:#2d507b;letter-spacing:8px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:10px;padding-left:8px}.dialog .btn{width:100%;margin-top:10px;min-height:44px}.dialog .tip{font-size:11px;color:#75869a;text-align:center;margin-top:16px}.demo{font-size:11px;color:#52667d;text-align:center;margin:18px 0 0}@media(max-width:850px){.screens{grid-template-columns:1fr}.sheet-head{display:block}.sheet-head span{display:block;margin-top:8px}.sheet{padding:20px}.window{max-width:540px;margin:auto}}@media(max-width:430px){.content{padding:18px 16px}.actions{grid-template-columns:1fr 95px}.dialog{padding:24px 20px}.shade{padding:20px}.status span.port{display:none}.url{font-size:10px}}

.btn{transition:background .18s,box-shadow .18s,transform .18s}.btn:hover:not(:disabled){box-shadow:0 4px 10px #365f9120;transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(1px)}.btn:disabled{cursor:not-allowed;opacity:.45}.address-card{transition:border-color .2s,box-shadow .2s}.address-card:hover{border-color:#aebfd5;box-shadow:0 5px 14px #365f9110}.status .dot{animation:statusPulse 2.8s ease-in-out infinite}.network-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:11px}.lan{color:#317653;display:flex;align-items:center;gap:5px}.lan i{width:5px;height:5px;border-radius:50%;background:currentColor}.network-trigger{border:0;background:#edf2f8;padding:5px 8px;border-radius:5px;color:#506781;font-size:11px}.folder-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.folder-actions .btn{min-height:34px;font-size:12px;font-weight:500}.footer{bottom:16px;align-items:center;font-size:10px;gap:8px}.exit-trigger{border:0;background:none;color:#5f7085;font-size:11px;padding:4px 0}.service-error{background:#fff7ed;border:1px solid #e7cba9;border-radius:10px;padding:14px;margin-bottom:18px}.error-label{font-size:11px;font-weight:650;color:#946333}.service-error h3{font-size:14px;margin:8px 0}.service-error p{font-size:11px;color:#796650;line-height:1.7;margin:0}.error-actions{display:flex;gap:8px;margin-top:12px}.error-actions .btn{font-size:12px;min-height:34px;padding:7px 12px}.network-list{display:grid;gap:12px;margin-top:22px}.network-choice{border:1px solid #d1dce8;border-radius:9px;padding:16px;text-align:left;background:#fff;color:#354b67}.network-choice.selected{border-color:#365f91;background:#f1f5fa}.network-choice strong{display:flex;justify-content:space-between;font-size:14px}.network-choice strong span{font-size:11px;color:#365f91}.network-choice code{display:block;margin-top:10px;font-size:13px;color:#687d94}.shade{animation:shadeIn .18s ease-out}.dialog{animation:dialogIn .22s ease-out}.toast{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);background:#294763;color:#fff;font-size:12px;white-space:nowrap;padding:11px 18px;border-radius:8px;box-shadow:0 4px 15px #263c5526;animation:toastIn .18s ease-out;z-index:3}.copied{border-color:#6eab89;background:#edf7f1;color:#326b50}.spinner{width:13px;height:13px;border-radius:50%;border:2px solid #ffffff60;border-top-color:white;animation:spin .8s linear infinite}@keyframes statusPulse{50%{box-shadow:0 0 0 4px #3176530c}}@keyframes shadeIn{from{opacity:0}to{opacity:1}}@keyframes dialogIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}@keyframes toastIn{from{opacity:0;bottom:60px}to{opacity:1;bottom:68px}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#reset .address-card .note{display:none}#reset .address-card{padding:14px}#reset .address-card .url{margin:10px 0;padding:8px}#reset .address-card .btn{min-height:36px}</style><div class="sheet"><header class="sheet-head"><h1>支点课堂 · 控制窗口</h1><span>设计预览 / 2.0.1 / 网络与维护增强</span></header><div class="screens"><section><div class="caption">01　主窗口 · 服务运行中</div><div class="window" id="main"></div></section><section><div class="caption">02　服务异常 · 原因与重试</div><div class="window" id="reset"></div></section></div><p class="demo">可交互预览：点击切换网络、重置密码、重试启动及目录按钮。所有服务状态与数据均为演示。</p></div><script>
const icons={open:'<path d="M14 3h7v7M21 3l-9 9"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',teacher:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',student:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>'};const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
function card(role,desc,url,name,note){return `<article class="address-card ${name==='student'?'student-card':''}"><div class="role-line"><span class="role-icon">${icon(name)}</span><div><h3>${role}</h3><p>${desc}</p></div></div>${name==='student'?'<div class="network-row"><span class="lan"><i></i>局域网访问已开放</span><button class="network-trigger" type="button">Wi-Fi ▾</button></div>':''}<div class="url">${url}</div><div class="actions"><button class="btn primary" type="button">${icon('open')}打开${role}</button><button class="btn" type="button" data-copy="${url}">${icon('copy')}复制网址</button></div><p class="note">${note}</p></article>`}
function main(){return `<div class="titlebar"><i class="traffic"></i><i class="traffic"></i><i class="traffic"></i><b>支点课堂</b></div><div class="content"><div class="brand"><img src="app-icon.png" alt="支点课堂图标"><div><h2>支点课堂<span class="version">2.0.1</span></h2><p>ClassNode · 桌面控制面板</p></div></div><div class="status"><div class="status-main"><i class="dot"></i><strong>服务运行中</strong><span class="port">端口 3001</span></div><button type="button">停止服务</button></div><h2 class="heading">打开课堂</h2><p class="intro">教师在这台电脑上管理课堂，学生通过局域网加入。</p>${card('教师端','备课、开课与课堂管理','http://localhost:3001/teacher/','teacher','在当前电脑打开，使用管理员密码登录。')}${card('学生端','加入课堂与完成学习任务','http://192.168.1.12:3001/classroom/','student','将网址发给学生；学生设备需连接同一局域网。')}<div class="maintenance"><div><h3>帮助与维护</h3><p>管理本机密码、数据和运行日志。</p></div><button class="btn reset-trigger" type="button">重置密码</button></div><div class="folder-actions"><button class="btn file-action" data-message="演示：打开系统数据文件夹" type="button">打开数据目录</button><button class="btn file-action" data-message="演示：打开系统日志文件夹" type="button">打开日志目录</button></div></div><footer class="footer"><span>关闭窗口后，服务继续在后台运行。</span><button class="exit-trigger" type="button">退出并停止服务</button></footer>`}
const passwordModal=`<div class="shade"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title"><button class="close" aria-label="关闭" type="button">×</button><span class="success">✓　重置完成</span><h3 id="reset-title">新的管理员密码已生成</h3><p>请使用下方密码登录教师端。<br>这次生成的是 6 位数字，方便输入。</p><div class="password-box"><label>新管理员密码</label><div class="password">482731</div></div><button class="btn primary" type="button" data-copy="482731">${icon('copy')}复制密码</button><button class="btn" type="button">${icon('open')}打开教师端登录</button><p class="tip">登录后，可在设置中改成自己的密码。</p></div></div>`;
function networkPanel(){return `<div class="shade network-shade"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="network-title"><button class="close" aria-label="关闭" type="button">×</button><h3 id="network-title">选择学生访问地址</h3><p>选择学生设备所在的局域网。<br>网址会随所选网络同步更新。</p><div class="network-list"><button class="network-choice selected" data-ip="192.168.1.12" data-network="Wi-Fi"><strong>Wi-Fi <span>当前使用</span></strong><code>192.168.1.12</code></button><button class="network-choice" data-ip="192.168.0.23" data-network="有线网络"><strong>有线网络</strong><code>192.168.0.23</code></button></div><p class="tip">网络名称和地址为设计演示数据。</p></div></div>`}
function showToast(win,label){win.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=label;win.append(t);setTimeout(()=>t.remove(),2200)}
function errorMain(){return main().replace(/<div class="status">[\s\S]*?<\/div><h2 class="heading">/,`<div class="service-error"><span class="error-label">服务启动失败</span><h3>端口 3001 被其他程序占用</h3><p>关闭占用端口的程序后重试；如仍无法启动，可打开日志查看原因。</p><div class="error-actions"><button class="btn primary retry" type="button">重试启动</button><button class="btn file-action" data-message="演示：打开日志文件夹" type="button">打开日志</button></div></div><h2 class="heading">`)}
document.querySelector('#main').innerHTML=main();document.querySelector('#reset').innerHTML=errorMain();
document.querySelectorAll('#reset .address-card .btn').forEach(b=>b.disabled=true);
document.addEventListener('click',async e=>{
const win=e.target.closest('.window');if(!win)return;
const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);copy.classList.add('copied');showToast(win,copy.dataset.copy==='482731'?'密码已复制':'网址已复制');setTimeout(()=>copy.classList.remove('copied'),1600)}catch{showToast(win,'请选中内容手动复制')}}
if(e.target.closest('.reset-trigger'))win.insertAdjacentHTML('beforeend',passwordModal);
if(e.target.closest('.network-trigger'))win.insertAdjacentHTML('beforeend',networkPanel());
if(e.target.closest('.close'))e.target.closest('.shade').remove();
const network=e.target.closest('[data-ip]');if(network){const url='http://'+network.dataset.ip+':3001/classroom/';const card=win.querySelector('.student-card');card.querySelector('.url').textContent=url;card.querySelector('[data-copy]').dataset.copy=url;card.querySelector('.network-trigger').textContent=network.dataset.network+' ▾';network.closest('.shade').remove();showToast(win,'学生网址已更新')}
if(e.target.closest('.file-action'))showToast(win,e.target.closest('.file-action').dataset.message);
if(e.target.closest('.exit-trigger')){win.insertAdjacentHTML('beforeend',`<div class="shade"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exit-title"><button class="close" aria-label="关闭" type="button">×</button><h3 id="exit-title">退出并停止服务？</h3><p>学生将暂时无法访问课堂。<br>如果只想收起窗口，点击窗口关闭按钮即可继续后台运行。</p><button class="btn close-dialog" type="button">继续运行</button><button class="btn exit-confirm" type="button">退出并停止服务</button></div></div>`)}
if(e.target.closest('.close-dialog'))e.target.closest('.shade').remove();
if(e.target.closest('.exit-confirm')){e.target.closest('.shade').remove();showToast(win,'设计演示，不会停止真实服务')}
const retry=e.target.closest('.retry');if(retry){retry.disabled=true;retry.innerHTML='<span class="spinner"></span>正在启动…';setTimeout(()=>{win.innerHTML=main();showToast(win,'服务已恢复，可打开课堂')},1400)}
});
</script></html>
