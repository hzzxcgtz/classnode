<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支点课堂 · 原生桌面窗口设计</title><style>
*{box-sizing:border-box}body{margin:0;background:#d9dfe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#23262b}.sheet{max-width:1184px;margin:auto;padding:30px 32px}.heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}.heading h1{font-size:21px;margin:0;font-weight:600}.heading span,.caption{font-size:12px;color:#626a75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.caption{margin:0 0 12px;font-weight:600}.window{height:784px;border:1px solid #aeb5be;overflow:hidden;box-shadow:0 18px 42px #2532442b;position:relative}.mac{background:#f5f5f5;border-radius:12px}.win{background:#f3f3f3;border-radius:8px;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.bar{height:50px;display:flex;align-items:center;background:#ececec;border-bottom:1px solid #d2d2d2;position:relative;padding:0 16px;gap:8px}.traffic{width:12px;height:12px;border-radius:50%;background:#ff5f57;border:1px solid #e24740}.traffic:nth-child(2){background:#febc2e;border-color:#e1a12b}.traffic:nth-child(3){background:#28c840;border-color:#21ad34}.bar-title{position:absolute;left:105px;right:105px;text-align:center;font-size:13px;font-weight:600}.mac .bar small{margin-left:auto;color:#777;font-size:11px}.win .bar{height:36px;background:transparent;border-bottom:0;padding:0 12px;gap:8px}.win .bar img{width:16px;height:16px}.win .bar-title{position:static;text-align:left;font-size:12px;font-weight:400}.window-controls{margin-left:auto;display:flex;height:36px;align-items:center;gap:0}.window-controls span{width:44px;text-align:center;font-size:15px;color:#333}.content{padding:24px 26px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:40px;height:40px;border-radius:9px}.brand h2{font-size:18px;font-weight:600;margin:0 0 4px}.brand p{font-size:12px;color:#707070;margin:0}.version{font-size:11px;color:#858585;margin-left:8px;font-weight:400}.status{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dcdcdc;padding-bottom:18px;margin-bottom:22px;font-size:12px}.status-main{display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#35a454;box-shadow:0 0 0 3px #35a4540b;animation:pulse 3s infinite}.status-main strong{font-weight:500}.port{color:#818181;margin-left:5px}button{font:inherit;cursor:pointer}.button{font-size:12px;border:1px solid #c7c7c7;border-radius:5px;padding:5px 12px;background:linear-gradient(#fff,#fcfcfc);color:#303030;box-shadow:0 1px 2px #0000000b;min-height:27px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.button.primary{background:#087df4;border-color:#0874e4;color:#fff;box-shadow:0 1px 2px #0060bb25}.button:active{filter:brightness(.95)}.button:hover{filter:brightness(.98)}.button:focus-visible{outline:3px solid #7aafe9;outline-offset:2px}svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.group-label{font-size:12px;color:#707070;margin:0 0 9px 1px;font-weight:500}.group{background:#fff;border:1px solid #d9d9d9;border-radius:8px;margin-bottom:24px;overflow:hidden}.entry{padding:15px 16px}.entry+.entry{border-top:1px solid #e6e6e6}.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.entry-head svg{color:#62666c;width:17px;height:17px}.entry-head strong{font-size:13px;font-weight:600}.entry-head span{color:#929292;font-size:11px;margin-left:auto}.url{font:12px "SFMono-Regular",Consolas,monospace;letter-spacing:-.25px;background:#f8f8f8;border:1px solid #dedede;border-radius:5px;padding:9px 10px;color:#555;user-select:text;white-space:nowrap}.entry-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.entry-note{font-size:11px;color:#919191;line-height:1.5;margin:9px 0 0}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:47px}.setting+.setting{border-top:1px solid #e8e8e8}.setting-label{font-size:12px}.setting-label small{font-size:11px;color:#939393;display:block;margin-top:3px}.select{min-width:151px;text-align:left;justify-content:space-between}.select span{background:#087df4;color:#fff;border-radius:3px;font-size:11px;padding:0 3px}.maintenance{display:flex;align-items:center;gap:8px;justify-content:space-between}.maintenance .button{font-size:11px;padding:5px 9px}.maintenance .label{font-size:12px;color:#777}.footer{position:absolute;bottom:0;left:0;right:0;border-top:1px solid #ddd;background:#ededed;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.footer p{font-size:10px;color:#808080;line-height:1.6;margin:0;max-width:260px}.footer .button{font-size:11px}.win .content{padding:23px 24px}.win .brand{margin-bottom:21px}.win .brand h2{font-size:20px}.win .brand img{width:42px;height:42px}.win .status{border:1px solid #ddd;border-radius:5px;padding:10px 12px;margin-bottom:23px;background:#fafafa}.win .group-label{color:#333;font-size:13px;font-weight:600}.win .group{border-radius:5px;border-color:#dedede;margin-bottom:22px}.win .entry{padding:16px}.win .url{border-radius:3px;background:#fff;border-bottom:1px solid #a0a0a0;font-size:12px;padding:9px 10px}.win .button{background:#fafafa;border-radius:4px;box-shadow:none;min-height:30px;padding:5px 12px;border-color:#d5d5d5;border-bottom-color:#b8b8b8}.win .button.primary{background:#0067c0;border-color:#0067c0;border-bottom-color:#00579f;color:#fff}.win .entry-head span{color:#7b7b7b}.win .select span{background:transparent;color:#555;font-size:14px}.win .setting{min-height:48px}.win .footer{background:#f3f3f3;padding:14px 24px}.win .maintenance .button{padding:5px 9px;font-size:11px}.tip{margin:20px 0 0;text-align:center;font-size:11px;color:#68717d}.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#30363ee8;color:white;border-radius:7px;padding:9px 14px;font-size:12px;animation:enter .18s ease-out;z-index:2}@keyframes pulse{50%{box-shadow:0 0 0 4px #35a45412}}@keyframes enter{from{opacity:0;translate:0 4px}to{opacity:1;translate:0 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:900px){.grid{grid-template-columns:1fr}.window{max-width:545px;margin:auto}.heading{display:block}.heading span{display:block;margin-top:8px}}
.content,.win .content{padding:20px 24px}.brand,.win .brand{margin-bottom:16px}.status,.win .status{margin-bottom:18px}.group,.win .group{margin-bottom:18px}.entry,.win .entry{padding:12px 16px}.entry-head{margin-bottom:8px}.entry-actions{margin-top:8px}
</style></head><body><main class="sheet"><header class="heading"><h1>支点课堂 · 原生桌面控制窗口</h1><span>macOS / Windows · 设计预览</span></header><div class="grid"><section><p class="caption">macOS · 系统工具窗口</p><div class="window mac" id="mac"></div></section><section><p class="caption">Windows · WinUI 风格</p><div class="window win" id="win"></div></section></div><p class="tip">两个平台使用同一组功能；标题栏、控件、字体、间距与交互反馈遵循各自的桌面习惯。</p></main><script>
const paths={teacher:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',student:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',open:'<path d="M14 3h7v7M21 3l-9 9M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>'};const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]}</svg>`;
function entry(role){const t=role==='teacher',url=t?'http://localhost:3001/teacher/':'http://192.168.1.12:3001/classroom/';return `<div class="entry"><div class="entry-head">${icon(role)}<strong>${t?'教师端':'学生端'}</strong><span>${t?'在本机管理课堂':'局域网访问已开放'}</span></div><div class="url">${url}</div><div class="entry-actions"><button class="button" data-copy="${url}">${icon('copy')}复制网址</button><button class="button primary" data-message="演示：打开${t?'教师端':'学生端'}">${icon('open')}打开${t?'教师端':'学生端'}</button></div>${t?'':'<p class="entry-note">学生设备需连接同一局域网。</p>'}</div>`}
function body(os){return `<div class="bar">${os==='mac'?'<i class="traffic"></i><i class="traffic"></i><i class="traffic"></i><div class="bar-title">支点课堂</div><small>控制面板</small>':'<img src="app-icon.png" alt=""><div class="bar-title">支点课堂</div><div class="window-controls"><span>−</span><span>□</span><span>×</span></div>'}</div><div class="content"><div class="brand"><img src="app-icon.png" alt="支点课堂"><div><h2>支点课堂<span class="version">2.0.1</span></h2><p>ClassNode · 课堂服务控制</p></div></div><div class="status"><div class="status-main"><i class="dot"></i><strong>服务运行中</strong><span class="port">端口 3001</span></div><button class="button" data-message="演示：停止服务">停止服务</button></div><h3 class="group-label">访问课堂</h3><div class="group">${entry('teacher')}${entry('student')}</div><h3 class="group-label">网络与管理</h3><div class="group"><div class="setting"><div class="setting-label">学生访问网络</div><button class="button select" data-message="演示：选择学生所在的网络">Wi-Fi · 192.168.1.12 <span>⌃⌄</span></button></div><div class="setting"><div class="setting-label">管理员密码<small>忘记密码时可在本机重置</small></div><button class="button" data-message="演示：重置为六位数字密码，并提供一键复制">重置密码…</button></div></div><div class="maintenance"><span class="label">本机文件</span><div style="display:flex;gap:8px"><button class="button" data-message="演示：打开数据目录">打开数据目录</button><button class="button" data-message="演示：打开日志目录">打开日志目录</button></div></div></div><footer class="footer"><p>关闭窗口后，服务仍在后台运行。<br>从${os==='mac'?'菜单栏':'系统托盘'}可重新打开控制面板。</p><button class="button" data-message="演示：确认退出并停止服务">退出并停止服务…</button></footer>`}
document.getElementById('mac').innerHTML=body('mac');document.getElementById('win').innerHTML=body('win');document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;let message=b.dataset.message;if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);message='网址已复制'}catch{message='设计预览：复制网址'}}if(message){const w=b.closest('.window');w.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;w.append(t);setTimeout(()=>t.remove(),2400)}});
</script></body></html>
