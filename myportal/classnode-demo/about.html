<section class="wrap section" id="why"><div class="section-title"><p class="label">01 / 开发初衷</p><h1 class="page-title">从真实的课堂难题出发</h1></div><div class="problems">
<article><span>一</span><h3>全班做到哪一步了？</h3><p>通过课堂看板集中查看参与和作答情况，巡视时可以优先关注卡在任务上的学生。</p></article>
<article><span>二</span><h3>怎样让学生带着任务探究？</h3><p>把问题和活动放进学习单，学生按任务作答。探究遇到卡点时，学生可以向教师配置的智能学伴提问。</p></article>
<article><span>三</span><h3>下课以后，怎么回看这一课？</h3><p>在历史记录里查看课堂参与、学习单和学生作答，按需导出，为讲评和下一次备课留一份依据。</p></article>
