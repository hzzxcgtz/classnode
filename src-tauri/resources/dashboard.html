<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支点课堂</title>
<style>
:root {
  color-scheme: light dark;
  --background: #f5f5f5;
  --surface: #ffffff;
  --field: #f8f8f8;
  --text: #23262b;
  --muted: #7b7b7b;
  --border: #d9d9d9;
  --separator: #e6e6e6;
  --accent: #087df4;
  --accent-border: #0874e4;
  --footer: #ededed;
  --button: linear-gradient(#fff, #fcfcfc);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--background);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  font-size: 12px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #7aafe9; outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
[hidden] { display: none !important; }
.window { display: flex; flex-direction: column; height: 100%; }
.content { padding: 22px 24px 18px; overflow-y: auto; flex: 1; min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.brand img { width: 40px; height: 40px; border-radius: 9px; }
.brand h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.brand p { font-size: 12px; color: var(--muted); margin: 0; }
.version { font-size: 11px; color: var(--muted); margin-left: 8px; font-weight: 400; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; min-height: 44px; }
.status-main { display: flex; gap: 7px; align-items: center; min-width: 0; }
.status-main strong { font-weight: 500; white-space: nowrap; }
.port { color: var(--muted); margin-left: 4px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #888; flex-shrink: 0; }
.status[data-phase="running"] .dot { background: #35a454; animation: pulse 3s infinite; }
.status[data-phase="starting"] .dot, .status[data-phase="stopping"] .dot {
  width: 12px; height: 12px; border-radius: 50%; background: transparent;
  border: 1.7px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.btn {
  font-size: 12px; border: 1px solid #c7c7c7; border-radius: 5px;
  padding: 5px 12px; background: var(--button); color: var(--text);
  box-shadow: 0 1px 2px #0000000b; min-height: 27px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  white-space: nowrap; transition: background-color .12s, border-color .12s;
}
.btn.primary { background: var(--accent); border-color: var(--accent-border); color: white; }
.btn:hover:not(:disabled) { filter: brightness(.97); }
.btn:active:not(:disabled) { filter: brightness(.92); }
.btn.copied { color: #287248; border-color: #8cb89a; background: #f0f8f2; }
svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.group-label { font-size: 12px; color: var(--muted); margin: 0 0 9px 1px; font-weight: 500; }
.group { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
.address-card { padding: 13px 16px; }
.address-card + .address-card { border-top: 1px solid var(--separator); }
.entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.entry-head svg { color: var(--muted); width: 17px; height: 17px; }
.entry-head h3 { font-size: 13px; font-weight: 600; margin: 0; }
.entry-head span { color: var(--muted); font-size: 11px; margin-left: auto; }
.url { font: 12px/1.5 "SFMono-Regular", Consolas, monospace; letter-spacing: -.25px; background: var(--field); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; color: var(--text); user-select: all; overflow-wrap: anywhere; }
.entry-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 9px; }
.entry-note { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 9px 0 0; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; min-height: 47px; }
.setting + .setting { border-top: 1px solid var(--separator); }
.setting-label small { font-size: 11px; color: var(--muted); display: block; margin-top: 3px; }
.network-trigger { min-width: 158px; justify-content: space-between; }
.network-trigger svg { width: 10px; height: 10px; }
.maintenance { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.maintenance-label { color: var(--muted); }
.folder-actions { display: flex; gap: 8px; }
.folder-actions .btn { font-size: 11px; padding: 5px 9px; }
.repo-links { display: flex; gap: 12px; margin-top: 17px; }
.repo-links button { font-size: 10px; color: var(--muted); background: none; border: 0; padding: 0; }
.footer { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--footer); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.footer p { font-size: 10px; color: var(--muted); line-height: 1.6; margin: 0; }
.footer .btn { font-size: 11px; }
.service-error { padding: 13px 16px; background: #fff8ef; border: 1px solid #e4cda8; border-radius: 7px; margin-bottom: 20px; }
.service-error h2 { font-size: 13px; margin: 0 0 8px; color: #926322; }
.service-error p { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 0; overflow-wrap: anywhere; }
.error-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.shade { position: fixed; inset: 0; z-index: 10; background: #00000032; display: grid; place-items: center; padding: 24px; animation: fade-in .15s ease-out; }
.dialog { width: 100%; max-width: 380px; position: relative; background: var(--background); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 50px #00000030; padding: 28px 24px 20px; animation: dialog-in .18s ease-out; }
.close { position: absolute; right: 12px; top: 10px; background: none; border: 0; color: var(--muted); font-size: 20px; }
.dialog h3 { font-size: 16px; margin: 0 0 12px; padding-right: 15px; font-weight: 600; }
.dialog p { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 0 0 12px; }
.dialog > .btn { margin-top: 10px; width: 100%; min-height: 30px; }
.dialog .tip { font-size: 11px; text-align: center; margin: 14px 0 0; }
.password-box { padding: 16px; margin: 16px 0 8px; text-align: center; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
.password-box label { font-size: 11px; color: var(--muted); }
.password { font-size: 32px; letter-spacing: 7px; padding-left: 7px; margin-top: 8px; font-variant-numeric: tabular-nums; font-weight: 600; user-select: all; }
.network-list { display: grid; gap: 8px; margin-top: 16px; }
.network-choice { padding: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); text-align: left; }
.network-choice.selected { border-color: var(--accent); }
.network-choice strong { display: flex; justify-content: space-between; font-size: 12px; }
.network-choice strong span { font-weight: 400; font-size: 11px; color: var(--accent); }
.network-choice code { display: block; margin-top: 7px; font-size: 12px; color: var(--muted); }
.toast { position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 48px); width: max-content; z-index: 20; padding: 9px 14px; background: #30363eed; color: #fff; border-radius: 7px; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; box-shadow: 0 3px 12px #00000020; animation: fade-in .15s ease-out; }
.spinner { width: 12px; height: 12px; border: 1.7px solid #ffffff70; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
[data-platform="windows"] { --background: #f3f3f3; --field: #fff; --accent: #0067c0; --accent-border: #00579f; --footer: #f3f3f3; --button: #fafafa; }
[data-platform="windows"] body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
[data-platform="windows"] .brand h1 { font-size: 20px; }
[data-platform="windows"] .status { border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; background: var(--surface); }
[data-platform="windows"] .group-label { color: var(--text); font-size: 13px; font-weight: 600; }
[data-platform="windows"] .group { border-radius: 5px; }
[data-platform="windows"] .url { border-radius: 3px; border-bottom-color: #a0a0a0; }
[data-platform="windows"] .btn { min-height: 30px; border-radius: 4px; box-shadow: none; border-color: #d5d5d5; border-bottom-color: #b8b8b8; }
[data-platform="windows"] .btn.primary { border-color: var(--accent-border); }
[data-platform="windows"] .dialog { border-radius: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px #35a4540d; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dialog-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-color-scheme: dark) {
  :root, [data-platform="windows"] { --background: #272727; --surface: #303030; --field: #353535; --text: #eeeeee; --muted: #a3a3a3; --border: #4b4b4b; --separator: #424242; --accent: #1685f3; --accent-border: #1685f3; --footer: #252525; --button: #3b3b3b; }
  [data-platform="windows"] { --background: #202020; --surface: #2b2b2b; --field: #323232; --accent: #0067c0; --accent-border: #247dbb; }
  .btn, [data-platform="windows"] .btn { border-color: var(--border); }
  .btn.copied { background: #2a4130; color: #9dceac; border-color: #5d8869; }
  .service-error { background: #3a3225; border-color: #796442; }
  .service-error h2 { color: #e4bd83; }
}
@media (max-width: 490px) {
  .content { padding: 18px 18px 16px; }
  .footer { padding: 12px 18px; }
  .network-trigger { min-width: 145px; font-size: 11px; }
  .entry-head span { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="window">
  <div class="content">
    <header class="brand">
      <img src="logo.png" alt="支点课堂">
      <div><h1>支点课堂<span class="version">__APP_VERSION__</span></h1><p>ClassNode · 课堂服务控制</p></div>
    </header>
    <section class="status" id="status" data-phase="starting" aria-busy="true">
      <div class="status-main" role="status" aria-live="polite">
        <i class="dot" id="dot" aria-hidden="true"></i><strong id="statusText">正在启动…</strong><span class="port" id="portText">端口 3001</span>
      </div>
      <button class="btn" id="serviceButton" disabled>正在启动…</button>
    </section>
    <section class="service-error" id="errorPanel" hidden>
      <h2>服务启动失败</h2><p id="errorText"></p><p>查看日志了解原因，处理后可重新启动服务。</p>
      <div class="error-actions"><button class="btn" data-folder="logs">打开日志</button><button class="btn primary" id="retryButton">重试启动</button></div>
    </section>
    <h2 class="group-label">访问课堂</h2>
    <div class="group" id="addresses"></div>
    <h2 class="group-label">网络与管理</h2>
    <div class="group">
      <div class="setting"><div class="setting-label">学生访问网络</div><button class="btn network-trigger" id="networkButton" disabled><span id="networkText">选择网络</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4 3-3 3 3m-6 4 3 3 3-3"/></svg></button></div>
      <div class="setting"><div class="setting-label">管理员密码<small>忘记密码时可在本机重置</small></div><button class="btn" id="resetButton" disabled>重置密码…</button></div>
    </div>
    <div class="maintenance"><span class="maintenance-label">本机文件</span><div class="folder-actions"><button class="btn" data-folder="data">打开数据目录</button><button class="btn" data-folder="logs">打开日志目录</button></div></div>
    <div class="repo-links"><button data-open="gitcode">GitCode 源码交流 ↗</button><button data-open="github">GitHub ↗</button></div>
  </div>
  <footer class="footer"><p>关闭窗口后，服务仍在后台运行。<br>从<span id="trayLabel">菜单栏</span>可重新打开控制面板。</p><button class="btn" id="exitButton">退出并停止服务…</button></footer>
</main>
<script>

const icons={open:'<path d="M14 3h7v7M21 3l-9 9"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',teacher:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',student:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>'};const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;

const invoke=window.__TAURI__?.core?.invoke || window.__TAURI__?.invoke;
function setPlatform(platform) {
  document.documentElement.dataset.platform = platform === 'windows' ? 'windows' : 'macos';
  document.getElementById('trayLabel').textContent = platform === 'macos' ? '菜单栏' : '系统托盘';
}
setPlatform(/Win/i.test(navigator.platform) ? 'windows' : 'macos');
let state={running:false,starting:true,port:3001,interfaces:[]}, selectedIp='', lanEnabled=true, pendingAction='', commandPending=false, bootWaiting=true, polling=false, temporaryPassword='', returnFocus=null, addressSignature='';
const $=id=>document.getElementById(id);
const bootDeadline=Date.now()+4000;
function phase(){ return pendingAction || (state.starting||bootWaiting?'starting':state.running?'running':state.lastError?'failed':'stopped'); }
function escapeHtml(value){const el=document.createElement('div');el.textContent=String(value);return el.innerHTML}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function url(role){return `http://${role==='teacher'?'localhost':selectedIp||'localhost'}:${state.port}/${role==='teacher'?'teacher':'classroom'}/`}
function card(role) {
  const teacher=role==='teacher';
  const enabled=phase()==='running'&&(teacher||(lanEnabled&&!!selectedIp));
  const summary=teacher?'在本机管理课堂':phase()==='starting'?'服务启动中':phase()==='stopping'?'服务停止中':!state.running?'服务恢复后可访问':!lanEnabled?'局域网访问已关闭':!selectedIp?'未检测到局域网地址':'局域网访问已开放';
  return `<article class="address-card"><div class="entry-head">${icon(role)}<h3>${teacher?'教师端':'学生端'}</h3><span>${summary}</span></div><div class="url">${escapeHtml(url(role))}</div><div class="entry-actions"><button class="btn" data-copy="${role}" ${enabled?'':'disabled'}>${icon('copy')}复制网址</button><button class="btn primary" data-open="${role}" ${enabled?'':'disabled'}>${icon('open')}打开${teacher?'教师端':'学生端'}</button></div>${teacher?'':'<p class="entry-note">学生设备需连接同一局域网。</p>'}</article>`;
}
function render() {
  const current=phase(), moving=current==='starting'||current==='stopping';
  $('status').hidden=current==='failed';
  $('status').dataset.phase=current;
  $('status').setAttribute('aria-busy',String(moving));
  $('errorPanel').hidden=current!=='failed';
  $('errorText').textContent=state.lastError||'';
  $('statusText').textContent=({running:'服务运行中',starting:'正在启动…',stopping:'正在停止…',stopped:'服务已停止',failed:'服务启动失败'})[current];
  $('portText').textContent=`端口 ${state.port}`;
  $('serviceButton').textContent=moving?$('statusText').textContent:current==='running'?'停止服务':'启动服务';
  $('serviceButton').disabled=moving;
  $('retryButton').disabled=moving;
  $('resetButton').disabled=current!=='running';
  $('networkButton').disabled=current!=='running';
  $('exitButton').disabled=moving;
  const iface=state.interfaces.find(i=>i.ip===selectedIp);
  $('networkText').textContent=iface?`${iface.label||iface.name} · ${iface.ip}`:'选择网络';
  const signature=JSON.stringify([current,state.port,selectedIp,lanEnabled]);
  if(addressSignature!==signature){addressSignature=signature;$('addresses').innerHTML=card('teacher')+card('student');}
}
async function poll() {
  if(polling)return;
  polling=true;
  try {
    state=await invoke('get_server_status');
    state.lastError=state.lastError||state.last_error;
    state.interfaces=state.interfaces||[];
    if(state.platform)setPlatform(state.platform);
    if(state.starting||state.running||state.lastError||Date.now()>=bootDeadline)bootWaiting=false;
    if(!commandPending) {
      if(pendingAction==='starting'&&!state.starting&&(state.running||state.lastError))pendingAction='';
      if(pendingAction==='stopping'&&!state.running)pendingAction='';
    }
    render();
    if(state.running&&!pendingAction) {
      try {
        const info=await invoke('cmd_desktop_request',{operation:'info',ip:null});
        selectedIp=info.selectedIp||selectedIp;
        lanEnabled=info.lanEnabled!==false;
      } catch { /* Native status remains available while the API finishes starting. */ }
    }
    if(!state.interfaces.some(i=>i.ip===selectedIp))selectedIp=state.interfaces[0]?.ip||'';
    render();
  } catch(e) {toast('无法读取服务状态：'+e);}
  finally {polling=false;}
}
async function service(start) {
  if(pendingAction||commandPending)return;
  bootWaiting=false;
  pendingAction=start?'starting':'stopping';
  commandPending=true;
  render();
  try {
    await invoke(start?'cmd_start_server':'cmd_stop_server');
    commandPending=false;
    await poll();
  } catch(e) {
    commandPending=false;pendingAction='';
    if(start)state.lastError=String(e);
    toast(String(e));
  } finally {render();}
}
function modal(title,body){closeModal();returnFocus=document.activeElement;const el=document.createElement('div');el.className='shade';el.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button class="close" aria-label="关闭">×</button><h3 id="dialogTitle">${title}</h3>${body}</div>`;document.body.append(el);el.querySelector('button').focus()}
function closeModal(){const el=document.querySelector('.shade');if(el?.dataset.pending==='true')return;if(el){el.remove();temporaryPassword='';returnFocus?.focus()}}
async function reset(){const btn=$('confirmReset');const overlay=btn.closest('.shade');overlay.dataset.pending='true';btn.disabled=true;btn.textContent='正在重置…';try{const data=await invoke('cmd_desktop_request',{operation:'reset',ip:null});if(!data.success||!/^\d{6}$/.test(data.temporaryPassword))throw Error(data.error||'未收到有效密码');const password=data.temporaryPassword;overlay.dataset.pending='false';modal('新的管理员密码已生成',`<p>这次生成的是 6 位数字，方便输入。</p><div class="password-box"><label>新管理员密码</label><div class="password" id="passwordValue"></div></div><button class="btn primary" id="copyPassword">${icon('copy')}复制密码</button><button class="btn" data-open="teacher">${icon('open')}打开教师端登录</button><p class="tip">登录后，可在设置中改成自己的密码。</p>`);temporaryPassword=password;$('passwordValue').textContent=password}catch(e){overlay.dataset.pending='false';btn.disabled=false;btn.textContent='确认重置';toast('重置失败：'+e)}}
async function copy(text,button){try{await invoke('cmd_copy_text',{text});button.classList.add('copied');toast('已复制');setTimeout(()=>button.classList.remove('copied'),1400)}catch(e){toast('复制失败，请选中内容手动复制')}}
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b||b.disabled)return;try{if(b.classList.contains('close'))closeModal();else if(b.dataset.open)await invoke('cmd_open_url',{urlType:b.dataset.open,ip:b.dataset.open==='teacher'?'localhost':selectedIp||null});else if(b.dataset.copy)await copy(url(b.dataset.copy),b);else if(b.dataset.folder)await invoke('cmd_open_directory',{kind:b.dataset.folder});else if(b.id==='serviceButton')await service(!state.running);else if(b.id==='retryButton')await service(true);else if(b.id==='resetButton')modal('重置管理密码？','<p>将生成新的 6 位数字密码。原密码会失效，已登录的教师会话将退出。</p><button class="btn primary" id="confirmReset">确认重置</button>');else if(b.id==='confirmReset')await reset();else if(b.id==='copyPassword')await copy(temporaryPassword,b);else if(b.id==='networkButton')modal('选择学生访问地址',`<p>选择学生设备所在的局域网，网址将同步更新。</p><div class="network-list">${state.interfaces.map(i=>`<button class="network-choice ${i.ip===selectedIp?'selected':''}" data-ip="${escapeHtml(i.ip)}"><strong>${escapeHtml(i.label||i.name)}${i.ip===selectedIp?'<span>当前使用</span>':''}</strong><code>${escapeHtml(i.ip)}</code></button>`).join('')||'<p>未检测到局域网地址，请检查网络连接。</p>'}</div>`);else if(b.dataset.ip){b.disabled=true;await invoke('cmd_desktop_request',{operation:'network',ip:b.dataset.ip});selectedIp=b.dataset.ip;closeModal();render();toast('学生网址已更新')}else if(b.id==='exitButton')modal('退出并停止服务？','<p>学生将暂时无法访问课堂。如果只想收起窗口，点击窗口关闭按钮即可继续后台运行。</p><button class="btn" id="keepRunning">继续运行</button><button class="btn primary" id="confirmExit">退出并停止服务</button>');else if(b.id==='keepRunning')closeModal();else if(b.id==='confirmExit'){b.disabled=true;await invoke('cmd_quit')}}catch(e){b.disabled=false;toast(String(e))}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='Tab'){const modal=document.querySelector('.shade');if(!modal)return;const buttons=[...modal.querySelectorAll('button:not(:disabled)')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
render();poll();setInterval(poll,2500);

</script>
</body>
</html>
